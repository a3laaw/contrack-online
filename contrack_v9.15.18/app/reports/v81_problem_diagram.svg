<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" dir="rtl">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="errorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="warningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#00000030"/>
    </filter>
  </defs>
  
  <!-- الخلفية -->
  <rect width="1200" height="800" fill="#f8fafc"/>
  
  <!-- العنوان -->
  <rect x="50" y="20" width="1100" height="70" rx="15" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <text x="600" y="65" text-anchor="middle" fill="white" font-size="28" font-weight="bold" font-family="Arial">
    تحليل مشكلة إخفاء البنود — V8.1
  </text>
  
  <!-- المشكلة -->
  <rect x="50" y="110" width="520" height="280" rx="12" fill="white" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="110" width="520" height="45" rx="12" fill="#fef2f2"/>
  <rect x="50" y="140" width="520" height="15" fill="#fef2f2"/>
  <text x="310" y="140" text-anchor="middle" fill="#dc2626" font-size="18" font-weight="bold" font-family="Arial">
    ❌ المشكلة (قبل الإصلاح)
  </text>
  
  <!-- الكود القديم -->
  <rect x="80" y="170" width="460" height="90" rx="8" fill="#1e293b"/>
  <text x="100" y="195" fill="#64748b" font-size="13" font-family="Courier"> الكود القديم (خاطئ):</text>
  <text x="100" y="218" fill="#22c55e" font-size="14" font-family="Courier">templated = self._client_contract_templated(cid)</text>
  <text x="100" y="240" fill="#ef4444" font-size="14" font-family="Courier" font-weight="bold">hide = bool(templated and not items)</text>
  
  <!-- النتيجة الخاطئة -->
  <rect x="80" y="275" width="460" height="50" rx="8" fill="#fee2e2"/>
  <text x="310" y="305" text-anchor="middle" fill="#dc2626" font-size="16" font-weight="bold" font-family="Arial">
    ❌ يُخفي البنود للعقد اليدوي (له قالب)!
  </text>
  
  <!-- المشكلة -->
  <rect x="80" y="340" width="460" height="35" rx="6" fill="#fef3c7"/>
  <text x="310" y="363" text-anchor="middle" fill="#92400e" font-size="14" font-family="Arial">
    المستخدم لا يستطيع اختيار البنود يدويًا
  </text>
  
  <!-- الحل -->
  <rect x="630" y="110" width="520" height="280" rx="12" fill="white" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <rect x="630" y="110" width="520" height="45" rx="12" fill="#f0fdf4"/>
  <rect x="630" y="140" width="520" height="15" fill="#f0fdf4"/>
  <text x="890" y="140" text-anchor="middle" fill="#16a34a" font-size="18" font-weight="bold" font-family="Arial">
    ✅ الحل (V8.1)
  </text>
  
  <!-- الكود الجديد -->
  <rect x="660" y="170" width="460" height="90" rx="8" fill="#1e293b"/>
  <text x="680" y="195" fill="#64748b" font-size="13" font-family="Courier"> الكود الجديد (صحيح):</text>
  <text x="680" y="218" fill="#3b82f6" font-size="14" font-family="Courier">auto = self._client_contract_auto(cid)</text>
  <text x="680" y="240" fill="#22c55e" font-size="14" font-family="Courier" font-weight="bold">hide = bool(auto and not items)</text>
  
  <!-- النتيجة الصحيحة -->
  <rect x="660" y="275" width="460" height="50" rx="8" fill="#dcfce7"/>
  <text x="890" y="305" text-anchor="middle" fill="#16a34a" font-size="16" font-weight="bold" font-family="Arial">
    ✅ يُخفي فقط للتلقائي — اليدوي يبقى ظاهر!
  </text>
  
  <!-- الفرق -->
  <rect x="660" y="340" width="460" height="35" rx="6" fill="#dbeafe"/>
  <text x="890" y="363" text-anchor="middle" fill="#1e40af" font-size="14" font-family="Arial">
    المستخدم يختار البنود يدويًا ✅
  </text>
  
  <!-- سير العمل -->
  <rect x="50" y="420" width="1100" height="160" rx="12" fill="white" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="455" text-anchor="middle" fill="#1e40af" font-size="20" font-weight="bold" font-family="Arial">
    🔄 سير عمل إنشاء عقد مقاول باطن (يدوي)
  </text>
  
  <!-- الخطوة 1 -->
  <rect x="100" y="480" width="150" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="175" cy="495" r="12" fill="#3b82f6"/>
  <text x="175" y="500" text-anchor="middle" fill="white" font-size="12" font-weight="bold" font-family="Arial">1</text>
  <text x="175" y="530" text-anchor="middle" fill="#1e293b" font-size="13" font-family="Arial">اختر العميل</text>
  
  <!-- سهم -->
  <text x="280" y="520" text-anchor="middle" fill="#64748b" font-size="30" font-family="Arial">←</text>
  
  <!-- الخطوة 2 -->
  <rect x="320" y="480" width="150" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="395" cy="495" r="12" fill="#3b82f6"/>
  <text x="395" y="500" text-anchor="middle" fill="white" font-size="12" font-weight="bold" font-family="Arial">2</text>
  <text x="395" y="525" text-anchor="middle" fill="#1e293b" font-size="13" font-family="Arial">اختر العقد</text>
  <rect x="355" y="535" width="80" height="18" rx="9" fill="#dcfce7"/>
  <text x="395" y="548" text-anchor="middle" fill="#16a34a" font-size="10" font-weight="bold" font-family="Arial">يدوي</text>
  
  <!-- سهم -->
  <text x="500" y="520" text-anchor="middle" fill="#64748b" font-size="30" font-family="Arial">←</text>
  
  <!-- الخطوة 3 -->
  <rect x="540" y="480" width="150" height="70" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="3"/>
  <circle cx="615" cy="495" r="12" fill="#22c55e"/>
  <text x="615" y="500" text-anchor="middle" fill="white" font-size="12" font-weight="bold" font-family="Arial">3</text>
  <text x="615" y="525" text-anchor="middle" fill="#166534" font-size="13" font-weight="bold" font-family="Arial">البنود تظهر</text>
  <rect x="575" y="535" width="80" height="18" rx="9" fill="#22c55e"/>
  <text x="615" y="548" text-anchor="middle" fill="white" font-size="10" font-weight="bold" font-family="Arial">ظاهر ✅</text>
  
  <!-- سهم -->
  <text x="720" y="520" text-anchor="middle" fill="#64748b" font-size="30" font-family="Arial">←</text>
  
  <!-- الخطوة 4 -->
  <rect x="760" y="480" width="150" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="835" cy="495" r="12" fill="#3b82f6"/>
  <text x="835" y="500" text-anchor="middle" fill="white" font-size="12" font-weight="bold" font-family="Arial">4</text>
  <text x="835" y="525" text-anchor="middle" fill="#1e293b" font-size="13" font-family="Arial">اختر البنود</text>
  <text x="835" y="545" text-anchor="middle" fill="#64748b" font-size="10" font-family="Arial">يدويًا</text>
  
  <!-- سهم -->
  <text x="940" y="520" text-anchor="middle" fill="#64748b" font-size="30" font-family="Arial">←</text>
  
  <!-- الخطوة 5 -->
  <rect x="980" y="480" width="150" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="1055" cy="495" r="12" fill="#3b82f6"/>
  <text x="1055" y="500" text-anchor="middle" fill="white" font-size="12" font-weight="bold" font-family="Arial">5</text>
  <text x="1055" y="525" text-anchor="middle" fill="#1e293b" font-size="13" font-family="Arial">احفظ العقد</text>
  
  <!-- المقارنة -->
  <rect x="50" y="610" width="520" height="170" rx="12" fill="white" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="645" text-anchor="middle" fill="#dc2626" font-size="16" font-weight="bold" font-family="Arial">
    ❌ القديم (خاطئ)
  </text>
  
  <rect x="80" y="660" width="460" height="30" rx="6" fill="#fef2f2"/>
  <text x="310" y="680" text-anchor="middle" fill="#991b1b" font-size="13" font-family="Arial">
    يدوي + له قالب + لا بنود → <tspan font-weight="bold" fill="#dc2626">مخفي ❌</tspan>
  </text>
  
  <rect x="80" y="700" width="460" height="30" rx="6" fill="#fef2f2"/>
  <text x="310" y="720" text-anchor="middle" fill="#991b1b" font-size="13" font-family="Arial">
    تلقائي + له قالب + لا بنود → <tspan font-weight="bold" fill="#dc2626">مخفي ❌</tspan>
  </text>
  
  <rect x="80" y="740" width="460" height="30" rx="6" fill="#fee2e2"/>
  <text x="310" y="760" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="bold" font-family="Arial">
    المستخدم لا يستطيع اختيار البنود!
  </text>
  
  <!-- الحل -->
  <rect x="630" y="610" width="520" height="170" rx="12" fill="white" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="645" text-anchor="middle" fill="#16a34a" font-size="16" font-weight="bold" font-family="Arial">
    ✅ الجديد (صحيح) — V8.1
  </text>
  
  <rect x="660" y="660" width="460" height="30" rx="6" fill="#f0fdf4"/>
  <text x="890" y="680" text-anchor="middle" fill="#166534" font-size="13" font-family="Arial">
    يدوي + له قالب + لا بنود → <tspan font-weight="bold" fill="#16a34a">ظاهر ✅</tspan>
  </text>
  
  <rect x="660" y="700" width="460" height="30" rx="6" fill="#fef3c7"/>
  <text x="890" y="720" text-anchor="middle" fill="#92400e" font-size="13" font-family="Arial">
    تلقائي + له قالب + لا بنود → <tspan font-weight="bold" fill="#d97706">مخفي ⚠</tspan>
  </text>
  
  <rect x="660" y="740" width="460" height="30" rx="6" fill="#dcfce7"/>
  <text x="890" y="760" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="bold" font-family="Arial">
    المستخدم يختار البنود يدويًا ✅
  </text>
</svg>
